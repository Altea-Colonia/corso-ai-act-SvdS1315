# Avvisa su Teams a ogni modifica del branch principale.
# Aggiunto in automatico dal portale (strumenti/notifiche_teams.py): il segreto TEAMS_WEBHOOK_URL
# lo imposta il portale, non serve configurare niente.
name: Notifica Teams

on:
  push:

jobs:
  notify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Invia notifica a Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg msg "$COMMIT_MSG" \
            --arg author "$AUTHOR" \
            --arg url "$COMMIT_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      { type: "TextBlock", text: ("🔔 Aggiornamento su " + $repo), weight: "Bolder", size: "Medium" },
                      { type: "TextBlock", text: ("Branch: " + $branch), isSubtle: true, spacing: "None" },
                      { type: "TextBlock", text: ("Autore: " + $author), wrap: true },
                      { type: "TextBlock", text: ("Commit: " + $msg), wrap: true },
                      { type: "TextBlock", text: "Esegui git pull per aggiornare la tua copia locale.", wrap: true, weight: "Bolder" }
                    ],
                    actions: [
                      { type: "Action.OpenUrl", title: "Vedi su GitHub", url: $url }
                    ]
                  }
                }
              ]
            }')
          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
